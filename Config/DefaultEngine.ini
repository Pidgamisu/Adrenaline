[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
; Audio latency. Every sound was landing late, and 30 ms of it was waste rather than physics.
; FAudioMixerWasapiRenderStream::InitializeHardware asks WASAPI for a device buffer built from
; the callback size, and rounds that request UP to a whole multiple of the device period, which
; is 480 frames at 48 kHz. The engine default of 1024 is not a multiple of 480, so it was padded
; to 1920 frames: 40 ms of device buffer under a 21 ms callback block. 480 IS one device period,
; so nothing is padded - 10 ms of buffer under a 10 ms block. Two queued buffers put a little
; slack back for a frame hitch. If audio ever crackles, go to 960, which is also a multiple.
; Engine defaults are 1024 and 1; the smallest callback size the engine accepts at all is 240.
; See If everything sounds late in docs/sound.md.
AudioCallbackBufferFrameSize=480
AudioNumBuffersToEnqueue=2

[/Script/Engine.RendererSettings]
; Adrenaline is an unlit game (see Content/Python/adrenaline_look.py). These four turn off the
; parts of the renderer that either fight that look or cost time it never uses.
; Auto-exposure is the important one: left on, the eye adaptation slowly brightens a black frame
; until the blacks go grey and the glow stops reading as glow.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AmbientOcclusion=False
; Lumen has nothing to light. Off, it buys back frame time a movement game wants.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
