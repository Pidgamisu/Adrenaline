[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Vaultborne
ProjectDisplayedTitle=NSLOCTEXT("[/Script/EngineSettings]", "ProjectDisplayedTitle", "Vaultborne")

[/Script/UnrealEd.ProjectPackagingSettings]
; Packaging for LAN play with friends, set up 2026-11-02. See *Playing with friends on a LAN* in
; docs/multiplayer.md.
;
; Development, NOT Shipping, and that is deliberate. The two reasons the ghost and the on-screen
; messages used to be here were fixed on 2026-11-02 (see *Next steps* 3 in CLAUDE.md), so what is
; left is simpler: there is no menu yet, so joining a game means a command line or the ` console,
; and Shipping has no console. A C4 detonation is also still invisible in Shipping until BP_C4 gets
; a Niagara effect. Switch this to PPBC_Shipping once there is a front end to join from.
Build=IfProjectHasCode
BuildConfiguration=PPBC_Development
BuildTarget=Getaway
FullRebuild=False
ForDistribution=False
IncludeDebugFiles=False
; Editor-only content (the Python tools, collections) stays out of the build.
bSkipEditorContent=True
+MapsToCook=(FilePath="/Game/Maps/TestCourse")
; Cook the folders the game needs outright, rather than leaning on the map's references: the piece
; Blueprints and the Vaultborne materials are reached through the game mode's catalog and through
; soft references, which the cooker does not always follow. Content/ThirdParty is deliberately not
; in this list - a pack's demo maps and unused meshes should come in only where a piece actually
; references them.
+DirectoriesToAlwaysCook=(Path="/Game/Maps")
+DirectoriesToAlwaysCook=(Path="/Game/Blueprints")
+DirectoriesToAlwaysCook=(Path="/Game/Materials")
; Content/__ExternalActors__ is 51 MB of orphaned one-file-per-actor packages belonging to a map
; called NewMap that no longer exists - TestCourse.umap is the only map in the project. Nothing
; references them, so they are junk and the folder can be deleted outright. Named here because an
; always-cook of all of /Game would otherwise have dragged the lot into the build.
+DirectoriesToNeverCook=(Path="/Game/__ExternalActors__")
+DirectoriesToNeverCook=(Path="/Game/Python")
+DirectoriesToNeverCook=(Path="/Game/Developers")
